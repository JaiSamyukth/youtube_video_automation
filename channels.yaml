# Every channel this pipeline runs. Edit this file to rename channels, change posting
# times, switch a channel on/off or change which themes and styles it uses.
# After changing any `slots`, run:  python -m pipeline sync-cron   (rewrites publish.yml's schedule)

timezone: Asia/Kolkata          # all slot times below are in this zone
skill_commit: 10287822          # kaomei/stickman-video-director, pinned
llm:
  provider: opencode            # opencode (free DeepSeek) | openai_compat (set LLM_BASE_URL/LLM_API_KEY/LLM_MODEL)
  model: opencode/deepseek-v4.1-flash-free
defaults:
  buffer_days: 2                # keep this many days of Shorts rendered and scheduled ahead
  lead_minutes: 45              # never schedule a Short sooner than this from now
  words_min: 110                # 110-150 words is about 40-55 seconds at the channel voice speed
  words_max: 150
  voice: en-US-AndrewMultilingualNeural
  voice_rate: "+10%"

channels:
  - id: deep-stories
    name: "Deep Stories (name TBD)"
    enabled: true
    # India evening + US late evening (19:00 IST = 08:30 ET; 07:30 IST = 21:00 ET the night before)
    slots: ["07:30", "19:00"]
    themes:
      - id: philosophy
        weight: 1
        styles: [A5, B7]
        tone: "calm, curious, a little haunting; ideas shown as small human stories"
      - id: mythology
        weight: 1
        styles: [A5, B7]
        tone: "storyteller: one myth, told so a stranger needs to know how it ends"
    voice: en-US-AndrewMultilingualNeural
    youtube: { secret_prefix: DEEP }
    instagram: { secret_prefix: DEEP, username: "" }   # fill in the IG handle once the account exists

  - id: level-up
    name: "Level Up (name TBD)"
    enabled: true
    # Early-morning motivation in India + US morning commute (18:00 IST = 07:30 ET)
    slots: ["06:30", "18:00"]
    themes:
      - id: fitness-money
        weight: 1
        styles: [B7]
        tone: "direct, energetic, practical; no guru talk, no promises of riches"
      - id: technology
        weight: 1
        styles: [B7]
        tone: "how things really work, with one 'wait, what?' moment"
    voice: en-US-BrianMultilingualNeural
    youtube: { secret_prefix: LEVELUP }
    instagram: { secret_prefix: LEVELUP, username: "" }

  - id: vs
    name: "VS (name TBD)"
    enabled: true
    # Younger, evening-heavy audience: India night + US evening (08:30 IST = 22:00 ET)
    slots: ["08:30", "20:30"]
    themes:
      - id: versus
        weight: 1
        styles: [B7]
        tone: "hype commentator energy, but every round decided by real facts"
    voice: en-US-GuyNeural
    youtube: { secret_prefix: VS }
    instagram: { secret_prefix: VS, username: "" }

  - id: genrec-tech
    name: "GenrecAI Builds (name TBD)"
    enabled: true
    # Builders and students: India lunch break + India night / US late morning (21:30 IST = 11:00 ET)
    slots: ["12:30", "21:30"]
    themes:
      - id: ai-builds
        weight: 1
        styles: [B7]
        tone: "a builder showing the trick behind the tech; clear, a little cheeky, never salesy"
    voice: en-US-AndrewMultilingualNeural
    # 8 uploads a day is over one Google project's quota (6), so this channel uses its own
    # project: secrets GENREC_YT_CLIENT_ID, GENREC_YT_CLIENT_SECRET, GENREC_YT_REFRESH_TOKEN.
    youtube: { secret_prefix: GENREC }
    instagram: { secret_prefix: GENREC, username: "" }
    # One Short in every `every` features one of our own products as the real example of the idea.
    # The rest are pure value. Facts below are the ONLY product claims a script may make.
    promo:
      every: 4
      footer: "Made by GenrecAI, a small software and AI studio in Tamil Nadu. We build websites, software, AI workflows, AI agents and custom CRMs: https://genrecai.com"
      products:
        - name: Tabble
          url: https://www.tabble.in
          facts:
            - "QR ordering and a live kitchen display for restaurants"
            - "guests scan, order and pay from the table"
            - "every ticket lands in the kitchen the moment the guest taps"
        - name: LuminaIQ
          url: https://www.luminaiq.fun
          facts:
            - "an AI study companion: upload a textbook or lecture PDF"
            - "gives cited answers, quizzes, four kinds of notes and flashcards"
            - "schedules reviews timed to your memory (spaced repetition)"
            - "used by more than 12,000 learners"
        - name: SelectStar
          url: https://selectstar.genrecai.com
          facts:
            - "an open-source (MIT) agentic database analyst"
            - "you ask a question in plain English"
            - "six specialised agents write the SQL, profile the data, build the charts and run the models"
        - name: HailBrowser
          url: https://hailbrowser.genrecai.com
          facts:
            - "an open-source (MIT) browser agent that runs in your own Chrome"
            - "you ask in plain English and it uses your signed-in browser"
            - "the same browser can be plugged into Claude Code, Cursor or Codex over MCP"
